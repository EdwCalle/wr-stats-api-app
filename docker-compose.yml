services:
  mongodb:
    image: mongodb/mongodb-community-server:9.0.4-ubi8-slim
    container_name: wr-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
  mongo-tools:
    image: mongo:8
    container_name: wr-mongo-tools
    profiles:
      - tools
    volumes:
      - ./assets:/assets
      - api_vol:/app

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: wr-api
    ports:
      - '3000:3000'
    env_file:
      - ./.env.development
volumes:
  mongodb_data:
  api_vol:
